const R=[[0,0,W,60],[0,H-60,W,60],[0,0,60,H],[W-60,0,60,H]],BL=[[140,120,220,160,70,'#8a8a8a','#444'],[650,110,200,150,60,'#b08a5a','#a33'],[1100,140,200,150,60,'#c9a66b','#a33'],[900,700,180,140,55,'#b08a5a','#a33'],[200,760,200,150,60,'#c9a66b','#36a']],

const keys={};let mouse={x:480,y:300},scene='menu',ov=null,sti=0,P,E=[],L=[],A=[],F=[],wave=0,phase=0,t=0,shake=0,msg='',msgT=0,obj='',wcd=0,UB=[],hov=0;

function hurt(d){d=Math.max(1,d-def());P.hp-=d;P.hit=.2;shake=6;pop(P.x,P.y,'-'+d,'#ff5050');if(P.hp<=0)scene='dead'}
