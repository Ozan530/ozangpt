<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sans Fight</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: white;
        font-family: "Courier New", monospace;
        overflow: hidden;
        user-select: none;
    }

    #game {
        width: 900px;
        max-width: 100vw;
        height: 650px;
        margin: auto;
        position: relative;
        background: #000;
        border: 4px solid #fff;
        overflow: hidden;
    }

    #dialogue {
        position: absolute;
        top: 25px;
        left: 40px;
        right: 40px;
        min-height: 80px;
        font-size: 20px;
        line-height: 1.5;
    }

    #battleBox {
        position: absolute;
        width: 560px;
        height: 300px;
        left: 50%;
        top: 260px;
        transform: translateX(-50%);
        border: 4px solid white;
        overflow: hidden;
        background: #050505;
    }

    #heart {
        position: absolute;
        width: 18px;
        height: 18px;
        background: red;
        transform: rotate(45deg);
        left: 271px;
        top: 140px;
        z-index: 10;
    }

    #heart::before,
    #heart::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        background: red;
        border-radius: 50%;
    }

    #heart::before {
        left: -9px;
        top: 0;
    }

    #heart::after {
        left: 0;
        top: -9px;
    }

    .bone {
        position: absolute;
        background: white;
        z-index: 5;
        box-shadow: 0 0 4px white;
    }

    .bone.horizontal {
        height: 14px;
    }

    .bone.vertical {
        width: 14px;
    }

    .bone::before,
    .bone::after {
        content: "";
        position: absolute;
        background: white;
        border-radius: 50%;
    }

    .bone.horizontal::before,
    .bone.horizontal::after {
        width: 22px;
        height: 22px;
        top: -4px;
    }

    .bone.horizontal::before {
        left: -10px;
    }

    .bone.horizontal::after {
        right: -10px;
    }

    .bone.vertical::before,
    .bone.vertical::after {
        width: 22px;
        height: 22px;
        left: -4px;
    }

    .bone.vertical::before {
        top: -10px;
    }

    .bone.vertical::after {
        bottom: -10px;
    }

    #sans {
        position: absolute;
        left: 50%;
        top: 125px;
        transform: translateX(-50%);
        font-size: 70px;
        color: white;
        text-shadow: 0 0 10px #fff;
    }

    #stats {
        position: absolute;
        bottom: 25px;
        left: 40px;
        right: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 20px;
    }

    #hpBar {
        width: 180px;
        height: 20px;
        border: 2px solid white;
        display: inline-block;
        vertical-align: middle;
    }

    #hpFill {
        height: 100%;
        width: 100%;
        background: #ffff00;
    }

    #menu {
        position: absolute;
        bottom: 70px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        background: black;
        color: #ff9b00;
        border: 3px solid #ff9b00;
        padding: 10px 24px;
        font-family: inherit;
        font-size: 20px;
        cursor: pointer;
    }

    button:hover {
        background: #ff9b00;
        color: black;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.92);
        z-index: 100;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
    }

    #gameOver h1 {
        font-size: 50px;
        margin: 10px;
    }

    #gameOver p {
        font-size: 22px;
    }

    .damage {
        position: absolute;
        color: yellow;
        font-size: 30px;
        font-weight: bold;
        z-index: 50;
        pointer-events: none;
        animation: damageAnim .5s forwards;
    }

    @keyframes damageAnim {
        0% {
            transform: translateY(0);
            opacity: 1;
        }
        100% {
            transform: translateY(-50px);
            opacity: 0;
        }
    }

    #hint {
        position: absolute;
        bottom: 2px;
        width: 100%;
        text-align: center;
        color: #777;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="game">

    <div id="sans">☠</div>

    <div id="dialogue">
        sans:<br>
        <span id="text">heya. you're gonna have a bad time.</span>
    </div>

    <div id="battleBox">
        <div id="heart"></div>
    </div>

    <div id="menu">
        <button onclick="attack()">FIGHT</button>
        <button onclick="heal()">ACT</button>
        <button onclick="heal()">ITEM</button>
        <button onclick="spare()">MERCY</button>
    </div>

    <div id="stats">
        <div>HP 20 / 20 <span id="hpBar"><span id="hpFill"></span></span></div>
        <div>LV 19</div>
        <div>SANS 92</div>
    </div>

    <div id="hint">
        WASD / Ok Tuşları = Hareket &nbsp; | &nbsp; Z / ENTER = Saldır
    </div>

    <div id="gameOver">
        <h1 id="resultTitle">GAME OVER</h1>
        <p id="resultText"></p>
        <button onclick="location.reload()">TEKRAR DENE</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const battleBox = document.getElementById("battleBox");
const heart = document.getElementById("heart");
const hpFill = document.getElementById("hpFill");
const text = document.getElementById("text");
const gameOver = document.getElementById("gameOver");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

let heartX = 271;
let heartY = 140;

let playerHP = 20;
let sansHP = 92;

let keys = {};
let attackCooldown = false;
let invincible = false;
let fightStarted = false;
let wave = 0;

const speed = 4;

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key === "Enter" || e.key.toLowerCase() === "z") {
        attack();
    }

    if (e.key === "Escape") {
        spare();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function updateHeart() {
    let dx = 0;
    let dy = 0;

    if (keys["arrowleft"] || keys["a"]) dx -= speed;
    if (keys["arrowright"] || keys["d"]) dx += speed;
    if (keys["arrowup"] || keys["w"]) dy -= speed;
    if (keys["arrowdown"] || keys["s"]) dy += speed;

    heartX += dx;
    heartY += dy;

    heartX = Math.max(15, Math.min(527, heartX));
    heartY = Math.max(15, Math.min(267, heartY));

    heart.style.left = heartX + "px";
    heart.style.top = heartY + "px";

    requestAnimationFrame(updateHeart);
}

updateHeart();

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function attack() {
    if (attackCooldown || sansHP <= 0) return;

    attackCooldown = true;

    let damage = Math.floor(random(5, 14));

    sansHP -= damage;

    showDamage(damage);

    if (sansHP <= 0) {
        sansHP = 0;
        win();
        return;
    }

    text.innerHTML =
        "heh.<br>nice try. you're not getting a free hit.";

    setTimeout(() => {
        attackCooldown = false;
        startWave();
    }, 900);
}

function showDamage(amount) {
    const d = document.createElement("div");

    d.className = "damage";
    d.innerText = "-" + amount;

    d.style.left = random(430, 500) + "px";
    d.style.top = random(130, 200) + "px";

    game.appendChild(d);

    setTimeout(() => d.remove(), 600);
}

function heal() {
    if (playerHP <= 0) return;

    playerHP = Math.min(20, playerHP + 4);

    updateHP();

    text.innerHTML =
        "you tried to heal.<br>sans looks mildly disappointed.";

    startWave();
}

function spare() {
    if (sansHP <= 15) {
        text.innerHTML =
            "sans:<br>...fine. you win. this time.";

        setTimeout(() => {
            resultTitle.innerText = "YOU SPARED SANS";
            resultText.innerText = "you somehow survived the bad time.";
            gameOver.style.display = "flex";
        }, 1200);
    } else {
        text.innerHTML =
            "sans:<br>you really think i'm gonna let you spare me?";

        startWave();
    }
}

function startWave() {
    wave++;

    if (wave % 3 === 0) {
        boneRain();
    } else if (wave % 3 === 1) {
        horizontalBones();
    } else {
        verticalBones();
    }
}

function createBone(x, y, w, h, vx, vy, duration = 4500) {
    const bone = document.createElement("div");

    bone.className = "bone";

    bone.style.left = x + "px";
    bone.style.top = y + "px";
    bone.style.width = w + "px";
    bone.style.height = h + "px";

    battleBox.appendChild(bone);

    let start = performance.now();

    function move(time) {
        let elapsed = time - start;

        x += vx;
        y += vy;

        bone.style.left = x + "px";
        bone.style.top = y + "px";

        if (collision(bone) && !invincible) {
            damagePlayer();
        }

        if (elapsed < duration &&
            x > -100 && x < 650 &&
            y > -100 && y < 400) {

            requestAnimationFrame(move);

        } else {
            bone.remove();
        }
    }

    requestAnimationFrame(move);
}

function horizontalBones() {
    text.innerHTML =
        "sans:<br>let's see you dodge this.";

    for (let i = 0; i < 7; i++) {
        setTimeout(() => {
            let fromLeft = Math.random() > .5;

            createBone(
                fromLeft ? -70 : 630,
                random(10, 270),
                90,
                14,
                fromLeft ? 5 : -5,
                0,
                5000
            );
        }, i * 350);
    }
}

function verticalBones() {
    text.innerHTML =
        "sans:<br>look out. they're coming from above.";

    for (let i = 0; i < 8; i++) {
        setTimeout(() => {
            createBone(
                random(10, 530),
                -50,
                14,
                80,
                0,
                4.5,
                4500
            );
        }, i * 300);
    }
}

function boneRain() {
    text.innerHTML =
        "sans:<br>you know what comes next.";

    for (let i = 0; i < 14; i++) {
        setTimeout(() => {
            let side = Math.random() > .5;

            createBone(
                side ? -60 : 620,
                random(0, 270),
                100,
                14,
                side ? 5.5 : -5.5,
                0,
                5000
            );
        }, i * 220);
    }
}

function collision(bone) {
    const a = heart.getBoundingClientRect();
    const b = bone.getBoundingClientRect();

    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );
}

function damagePlayer() {
    if (invincible) return;

    invincible = true;

    playerHP--;

    updateHP();

    heart.style.background = "white";

    setTimeout(() => {
        heart.style.background = "red";
        invincible = false;
    }, 350);

    if (playerHP <= 0) {
        lose();
    }
}

function updateHP() {
    hpFill.style.width = (playerHP / 20 * 100) + "%";

    if (playerHP <= 5) {
        hpFill.style.background = "red";
    } else {
        hpFill.style.background = "yellow";
    }
}

function lose() {
    resultTitle.innerText = "GAME OVER";
    resultText.innerText =
        "sans: kid... maybe next time don't get hit.";
    gameOver.style.display = "flex";
}

function win() {
    document.querySelectorAll(".bone").forEach(b => b.remove());

    text.innerHTML =
        "sans:<br>...you actually did it.";

    setTimeout(() => {
        resultTitle.innerText = "SANS DEFEATED";
        resultText.innerText =
            "you won the fight. congratulations.";
        gameOver.style.display = "flex";
    }, 1200);
}

setTimeout(() => {
    startWave();
}, 1500);
</script>

</body>
</html>
