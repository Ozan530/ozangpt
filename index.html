<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>OzanGPT | LiteAI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #101014;
      color: #f4f4f7;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 850px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 16px;
      border-bottom: 1px solid #292930;
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
    }

    .brand span { color: #a78bfa; }

    button, textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 11px 15px;
    }

    #newChat {
      background: #282832;
      color: white;
    }

    #messages {
      flex: 1;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .welcome {
      margin: auto 0;
      text-align: center;
      color: #b8b8c5;
      padding: 32px 10px;
    }

    .welcome h1 {
      color: white;
      font-size: clamp(27px, 6vw, 42px);
      margin-bottom: 8px;
    }

    .message {
      max-width: 92%;
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #5141a5;
    }

    .assistant {
      align-self: flex-start;
      background: #202027;
      border: 1px solid #30303a;
    }

    .composer {
      position: sticky;
      bottom: 0;
      background: #101014;
      padding: 12px 0 max(8px, env(safe-area-inset-bottom));
    }

    .inputBox {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid #383842;
      border-radius: 17px;
      padding: 8px;
      background: #1b1b22;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      padding: 10px;
      max-height: 160px;
    }

    #send {
      background: #8b5cf6;
      color: white;
      font-weight: 700;
    }

    #send:disabled {
      opacity: .5;
      cursor: wait;
    }

    .note {
      font-size: 12px;
      color: #8d8d9b;
      text-align: center;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .app { padding: 12px; }
      .brand { font-size: 19px; }
      .message { max-width: 96%; }
      #newChat { padding: 10px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">Ozan<span>GPT</span> <small>· LiteAI</small></div>
      <button id="newChat" type="button">＋ Yeni sohbet</button>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>Merhaba!</h1>
        <p>Ben OzanGPT. Bugün sana nasıl yardımcı olabilirim?</p>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <div class="inputBox">
        <textarea id="prompt" rows="1"
          placeholder="OzanGPT'ye bir şey sor..."
          aria-label="Mesajın"></textarea>
        <button id="send" type="submit">Gönder</button>
      </div>
      <div class="note">
        Yapay zekâ yanıtlarını önemli konularda kontrol et.
      </div>
    </form>
  </main>

  <script>
    /*
      GÜVENLİK:
      Bu sayfa API anahtarını KEY.txt dosyasından okumaz.
      /api/chat adresinde, anahtarı sunucuda saklayan
      bir arka uç bulunmalıdır.
    */
    const CHAT_ENDPOINT = "/api/chat";

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    let history = [];
    let busy = false;

    function addMessage(role, text) {
      welcome?.remove();

      const el = document.createElement("div");
      el.className = "message " + role;
      el.textContent = text;

      messagesEl.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });

      return el;
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;

      busy = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      history.push({ role: "user", content: text });

      const answerEl = addMessage("assistant", "Düşünüyorum...");
      let answer = "";

      try {
        const response = await fetch(CHAT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history.slice(-16)
          })
        });

        if (!response.ok) {
          throw new Error("Sunucu yanıtı: " + response.status);
        }

        const data = await response.json();

        if (typeof data.reply !== "string") {
          throw new Error("Sunucu yanıt biçimi beklenenden farklı.");
        }

        answer = data.reply;
        answerEl.textContent = answer || "Yanıt alınamadı.";

        history.push({ role: "assistant", content: answer });
      } catch (error) {
        answerEl.textContent =
          "Bağlantı kurulamadı. Sunucu adresini ve internet bağlantısını kontrol et.\n\n" +
          "Ayrıntı: " + error.message;

        history.pop();
      } finally {
        busy = false;
        sendBtn.disabled = false;
        promptEl.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = promptEl.value.trim();
      if (!text) return;

      promptEl.value = "";
      promptEl.style.height = "auto";
      sendMessage(text);
    });

    promptEl.addEventListener("input", () => {
      promptEl.style.height = "auto";
      promptEl.style.height =
        Math.min(promptEl.scrollHeight, 160) + "px";
    });

    promptEl.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("newChat").addEventListener("click", () => {
      history = [];
      messagesEl.replaceChildren();

      const el = document.createElement("div");
      el.className = "welcome";
      el.innerHTML =
        "<h1>Yeni sohbet!</h1><p>Ne hakkında konuşalım?</p>";

      messagesEl.appendChild(el);
      promptEl.focus();
    });
  </script>
</body>
</html>
